name: Build Kivy APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # استخدام أداة Buildozer الرسمية لبناء تطبيق Kivy لأندرويد
      - name: Build with Buildozer
        uses: kivy/buildozer-action@v1
        with:
          filename: buildozer.spec
          command: android debug

      # رفع ملف الـ APK الناتج في الـ Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivy-solar-apk
          path: bin/*.apk
